<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4361ee">
    <title>Offline | Expense Tracker</title>
    <style>
        :root { --bg: #f5f7fa; --surface: #fff; --text: #212529; --muted: #6c757d; --primary: #4361ee; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b1120; --surface: #141c2f; --text: #e5e9f2; --muted: #94a3b8; --primary: #7b93ff; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--bg); color: var(--text); font-family: Cairo, system-ui, sans-serif; }
        .card { background: var(--surface); border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%;
                text-align: center; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12); }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; }
        p { color: var(--muted); margin: 0 0 6px; line-height: 1.6; }
        button { margin-top: 18px; padding: 10px 26px; border: 0; border-radius: 22px; background: var(--primary);
                 color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="assets/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Connect to the internet to see and add your expenses.</p>
        <p dir="rtl">أنت غير متصل بالإنترنت. اتصل بالإنترنت لعرض مصروفاتك وإضافتها.</p>
        <button onclick="location.reload()">Try again · حاول مرة أخرى</button>
    </div>
</body>
</html>
